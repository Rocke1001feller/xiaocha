<!DOCTYPE html>
<!--
  小猹 WXT Popup — UI design placeholder (v4).
  Adapted from designs/popup.html for WXT entrypoints/popup/ convention.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>小猹</title>
    <link rel="stylesheet" href="./style.css" />
    <!-- Scroll-Linked Animations polyfill -->
    <script src="/scroll-timeline.js"></script>
  </head>

  <body>
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"></div>
        <span class="brand-name">小猹</span>
      </div>
      <button class="login-btn" type="button">Login</button>
    </header>

    <!-- Hero / Chat box -->
    <section class="hero">
      <div class="hero-header">
        <h1 class="hero-title">Select text to start</h1>
        <span class="coming-soon">Coming Soon</span>
      </div>

      <div class="hero-chatbox" role="search">
        <button class="chat-add" type="button" aria-label="Add attachment">+</button>
        <input type="text" placeholder="Ask 小猹 anywhere…" aria-label="Ask 小猹" disabled />
        <div class="chat-actions">
          <button class="chat-voice" type="button" aria-label="Voice input">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="2" width="6" height="12" rx="3"/>
              <path d="M5 10a7 7 0 0 0 14 0"/>
              <line x1="12" y1="19" x2="12" y2="22"/>
            </svg>
          </button>
          <button class="chat-image" type="button" aria-label="Image input">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="5" width="18" height="14" rx="2"/>
              <circle cx="8.5" cy="10.5" r="1.5"/>
              <path d="M21 16l-5-5L8 19"/>
            </svg>
          </button>
          <button class="chat-ai" type="button">AI</button>
        </div>
      </div>

      <p class="hero-hint">随时随地小查一下</p>
    </section>

    <!-- Recent Cards coverflow -->
    <section class="recent">
      <div class="recent-header">
        <h2 class="recent-title">Recent Cards</h2>
        <a class="recent-all" href="#" id="recent-all">View all</a>
      </div>

      <div class="cards-wrapper">
        <ul class="cards">
          <li><img class="cover" draggable="false" src="https://assets.codepen.io/89905/coverflow--Front-1024x1024.jpg" width="1200" height="1200" alt="Front" /></li>
          <li><img class="cover" draggable="false" src="https://assets.codepen.io/89905/coverflow--A-Thousand-Clouds-Front-Cover-1024x1024.jpg" width="1200" height="1200" alt="A Thousand Clouds" /></li>
          <li><img class="cover" draggable="false" src="https://assets.codepen.io/89905/coverflow--Odd-World-EP-SMALL-1024x1024.png" width="1200" height="1200" alt="Odd World EP" /></li>
          <li><img class="cover" draggable="false" src="https://assets.codepen.io/89905/coverflow--Forest-Blue-Pre-LR-1024x1024.png" width="1200" height="1200" alt="Forest Blue" /></li>
          <li><img class="cover" draggable="false" src="https://assets.codepen.io/89905/coverflow--MOM-Remixes-1024x1024.jpg" width="1200" height="1200" alt="MOM Remixes" /></li>
          <li><img class="cover" draggable="false" src="https://assets.codepen.io/89905/coverflow--ALONE-TOGETHER-remix-V71-550x550.jpg" width="1200" height="1200" alt="ALONE TOGETHER" /></li>
          <li><img class="cover" draggable="false" src="https://assets.codepen.io/89905/coverflow--Nature-Therapy-Pre-LR-550x550.png" width="1200" height="1200" alt="Nature Therapy" /></li>
          <li><img class="cover" draggable="false" src="https://assets.codepen.io/89905/coverflow--Deep-Dive-Ambient-Edits-V8-550x550.jpg" width="1200" height="1200" alt="Deep Dive Ambient Edits" /></li>
          <li><img class="cover" draggable="false" src="https://assets.codepen.io/89905/coverflow--Alpine-Koresma-x-Aroth-Artwork-550x550.jpg" width="1200" height="1200" alt="Alpine" /></li>
          <li><img class="cover" draggable="false" src="https://assets.codepen.io/89905/coverflow--Out-Of-the-Dark-Cover-550x550.jpg" width="1200" height="1200" alt="Out Of The Dark" /></li>
          <li><img class="cover" draggable="false" src="https://assets.codepen.io/89905/coverflow--2020-06-07-Marley-Carroll-Single-Blue-550x550.jpg" width="1200" height="1200" alt="Marley Carroll Single Blue" /></li>
          <li><img class="cover" draggable="false" src="https://assets.codepen.io/89905/coverflow--Deep-Dive-EP-Cover-550x550.jpg" width="1200" height="1200" alt="Deep Dive EP" /></li>
          <li><img class="cover" draggable="false" src="https://assets.codepen.io/89905/coverflow--Blackrose-Cover-550x550.jpg" width="1200" height="1200" alt="Blackrose" /></li>
          <li><img class="cover" draggable="false" src="https://assets.codepen.io/89905/coverflow--FW-Imagine-Gold-Remixes2-550x550.jpg" width="1200" height="1200" alt="Imagine Gold Remixes" /></li>
          <li><img class="cover" draggable="false" src="https://assets.codepen.io/89905/coverflow--We-Are-COVER-MAIN-550x550.jpg" width="1200" height="1200" alt="We Are" /></li>
          <li><img class="cover" draggable="false" src="https://assets.codepen.io/89905/coverflow--Bath-House-Flat-550x550.jpg" width="1200" height="1200" alt="Bath House" /></li>
          <li><img class="cover" draggable="false" src="https://assets.codepen.io/89905/coverflow--Pronoia-JPG-550x550.jpg" width="1200" height="1200" alt="Pronoia" /></li>
          <li><img class="cover" draggable="false" src="https://assets.codepen.io/89905/coverflow--Lapa9Theory-Cracking-Stores-no-Loci-logo-550x550.jpg" width="1200" height="1200" alt="Lapa9Theory Cracking Stores" /></li>
          <li><img class="cover" draggable="false" src="https://assets.codepen.io/89905/coverflow--EMANCIPATOR_MOM_AlbumCover-2000px-550x550.jpg" width="1200" height="1200" alt="EMANCIPATOR MOM" /></li>
          <li><img class="cover" draggable="false" src="https://assets.codepen.io/89905/coverflow--MURGE-ep-cvr-3000x3000-550x550.jpg" width="1200" height="1200" alt="MURGE EP" /></li>
          <li><img class="cover" draggable="false" src="https://assets.codepen.io/89905/coverflow--Emancipator_Laybrinth-ART-01-4000x4000-at-300dpi-550x550.jpg" width="1200" height="1200" alt="Emancipator Labyrinth" /></li>
          <li><img class="cover" draggable="false" src="https://assets.codepen.io/89905/coverflow--cover-550x550.jpg" width="1200" height="1200" alt="Loci Cover" /></li>
        </ul>
      </div>
    </section>

    <!-- Bottom navigation -->
    <nav class="bottom-nav">
      <div class="nav-item is-active" title="Cards" aria-label="Cards">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3"  y="3"  width="7" height="7" rx="1"/>
          <rect x="14" y="3"  width="7" height="7" rx="1"/>
          <rect x="3"  y="14" width="7" height="7" rx="1"/>
          <rect x="14" y="14" width="7" height="7" rx="1"/>
        </svg>
      </div>
      <div class="nav-item" title="Library" aria-label="Library">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 4v16h2V4H4zm4 0v16h2V4H8zm4 0v16h2V4h-2zm4 0l3 16 2-.5L20 4l-2 .5z"/>
        </svg>
      </div>
      <div class="nav-divider" aria-hidden="true"></div>
      <div class="nav-item" title="Chat" aria-label="Chat">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v10z"/>
        </svg>
      </div>
      <div class="nav-item" id="nav-settings" title="Settings" aria-label="Settings">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="4"  y1="6"  x2="20" y2="6"/>
          <line x1="4"  y1="12" x2="20" y2="12"/>
          <line x1="4"  y1="18" x2="20" y2="18"/>
          <circle cx="8"  cy="6"  r="2" fill="currentColor"/>
          <circle cx="16" cy="12" r="2" fill="currentColor"/>
          <circle cx="9"  cy="18" r="2" fill="currentColor"/>
        </svg>
      </div>
    </nav>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
